name: Documentation Build

on:
  # please activate trigger after first release after 4.0.0
  #  pull_request:
  #    types: [ opened, synchronize, reopened ]
  push:
    tags:
      - '^\\d+\\.\\d+\\.\\d+$'

jobs:
  DocsBuild:
    uses: IsyFact/isy-github-actions-templates/.github/workflows/docs_build_template.yml@v3.0.0
    secrets:
      ANTORA_TRIGGER_TOKEN: ${{ secrets.ANTORA_TRIGGER_TOKEN }}
