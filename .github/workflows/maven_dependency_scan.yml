name: Maven Dependency Scan
on:
  pull_request:
    branches:
      - develop
      - support/**
    paths:
      - 'pom.xml'
  workflow_dispatch:

jobs:
  SnykScan:
    permissions:
      contents: read
    uses: IsyFact/isy-github-actions-templates/.github/workflows/maven_dependency_scan_template.yml@v3.0.0
    with:
      snyk-reference: $GITHUB_REF_NAME
      snyk-organization: ${{ vars.SNYK_ORG_ID }}
    secrets:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
